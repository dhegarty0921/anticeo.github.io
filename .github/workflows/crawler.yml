name: Crawl feeds and update news

on:
  schedule:
    # every 15 minutes; change to '*/5 * * * *' if you want the old 5-min cadence
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # to commit anticeo-news.json
  pages: write      # to deploy the site (GITHUB_TOKEN pushes don't retrigger pages.yml)
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser pyyaml

      - name: Crawl feeds
        run: python3 crawl_rss.py

      - name: Build news JSON
        run: python3 build_json.py

      - name: Commit updated news
        run: |
          git config user.name "ANTICEO Bot"
          git config user.email "bot@users.noreply.github.com"
          git add anticeo-news.json
          git diff --cached --quiet || git commit -m "update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Retry push: GitHub occasionally answers transient 5xx on push,
          # which used to kill the whole cycle including the site deploy.
          for i in 1 2 3; do
            # Clear any conflicted rebase left over from a previous attempt
            git rebase --abort 2>/dev/null || true
            if ! git pull --rebase origin main; then
              # Overlapping scheduled runs both regenerate anticeo-news.json,
              # so the rebase conflicts in that file every time. It is rebuilt
              # wholesale each crawl — keep our freshly generated version.
              # (During a rebase, --theirs = our commit being replayed.)
              if [ -f .git/MERGE_MSG ] || git status --porcelain | grep -q '^UU'; then
                git checkout --theirs anticeo-news.json
                git add anticeo-news.json
                GIT_EDITOR=true git rebase --continue || git rebase --skip
              else
                echo "pull failed for a non-conflict reason on attempt $i"
                sleep 30
                continue
              fi
            fi
            if git push origin main; then
              exit 0
            fi
            echo "push attempt $i failed; retrying in 30s"
            sleep 30
          done
          echo "push failed after 3 attempts"
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        # Pages deployments occasionally stall in "updating_pages" and burn the
        # full timeout (runs #594/#595). Don't fail the run on the first stall;
        # the retry step below redeploys the same artifact.
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
