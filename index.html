<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ANTICEO</title>
<style>
body {
    background:#000;
    color:#fff;
    font-family:Georgia,serif;
    max-width:1200px;
    margin:0 auto;
    padding:8px 12px;
  }
  header {
    margin:8px 0 12px;
  }
  header h1 {
    font-size:2.5rem;
    text-align:center;
    margin:10px 0;
    font-weight:bold;
    letter-spacing:2px;
  }
  header h1 a {
    color:#fff;
    text-decoration:none;
  }
  header h1 a:hover {
    text-decoration:underline;
  }
  /* Add a highlight style for the CHUDS vs SHITLIBS line */
  .headline-banner {
    text-align:center;
    font-size:2.2rem;
    font-weight:900;
    color:#fff;
    margin:25px 0;
    text-transform:uppercase;
  }

  #news-columns {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width:1024px) {
    #news-columns {
      grid-template-columns: 1fr 1fr 1fr;
    }
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    margin: 6px 0;
    line-height: 1.3;
  }

  a {
    text-decoration: underline;
    color: #fff;
  }

  a:hover {
    text-decoration: none;
    color: #ccc;
  }

  .source {
    opacity: .7;
  }

  .ts {
    opacity: .55;
    font-size: .85em;
    white-space: nowrap;
  }

  .new-flag {
    color: #ff3333;
    font-weight: bold;
    font-size: .8em;
    letter-spacing: 1px;
  }

  footer {
    margin: 24px 0 8px;
    font-size: .85rem;
    opacity: .7;
    text-align: center;
    color: #aaa;
  }
 </style>
</head>
<body>
  <header id="headline"><h1>ANTICEO</h1><hr></header>
  <main id="news-columns"></main>
  <footer>
    Updated automatically by CLASSWARFARE servers<br>
    Track ICE activity near you:
    <a href="https://www.iceinmyarea.org/" target="_blank" rel="noopener" style="color:#aaa;">ICE in My Area</a>
    ·
    <a href="https://deportationtracker.live/" target="_blank" rel="noopener" style="color:#aaa;">Deportation Tracker</a>
  </footer>

<script>
  const ORDER = [
    "CHUDS VS SHITLIBS",
    "CULTURE WAR",
    "MILITARY INDUSTRIAL COMPLEX",
    "PARA POLITICAL INTRIGUE",
    "SETTLER COLONIAL STATE FALSE FLAG LIES",
    "ICE IS A DRESS REHEARSAL FOR STATE REPRESSION"
  ];

  const NEW_WINDOW_MS = 12 * 3600 * 1000; // flag items newer than 12h

  function fmtTs(ts) {
    const d = new Date(ts);
    if (isNaN(d)) return "";
    let h = d.getHours();
    const m = String(d.getMinutes()).padStart(2, "0");
    const ap = h >= 12 ? "p" : "a";
    h = h % 12 || 12;
    return ` ${h}:${m}${ap}`;
  }

  function agoText(iso) {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (s < 90) return `${s} seconds ago`;
    const m = Math.round(s / 60);
    if (m < 90) return `${m} minute${m === 1 ? "" : "s"} ago`;
    const h = Math.round(m / 60);
    return `${h} hour${h === 1 ? "" : "s"} ago`;
  }

  fetch("./anticeo-news.json?t=" + Date.now())
    .then(r => r.json())
    .then(data => {
      // headline as you already had it …
      const container = document.getElementById("news-columns");
      container.innerHTML = "";

      // live footer: freshness + story count
      const total = (data.sections || []).reduce((n, s) => n + (s.items || []).length, 0);
      const footerEl = document.querySelector("footer");
      if (data.generated_at) {
        footerEl.textContent = `Updated ${agoText(data.generated_at)} by CLASSWARFARE servers · ${total} stories`;
      } else {
        footerEl.textContent = `Updated automatically by CLASSWARFARE servers · ${total} stories`;
      }

      // map by title for stable ordering
      const map = Object.fromEntries((data.sections||[]).map(s => [s.title, s]));
      const sections = ORDER.map(k => map[k]).filter(Boolean);

      sections.forEach(sec => {
        const count = (sec.items || []).length;
        const h = document.createElement("h2");
        h.textContent = `${sec.title} (${count})`;
        h.style.textAlign = "center";
        h.style.margin = "18px 0 8px";
        h.style.fontSize = "1.2rem";
        h.style.letterSpacing = "1px";
        container.appendChild(h);

        const ul = document.createElement("ul");
        (sec.items || []).forEach(it => {
          const li = document.createElement("li");
          const isNew = it.ts && (Date.now() - new Date(it.ts).getTime()) < NEW_WINDOW_MS;
          li.innerHTML = `<a href="${it.url || '#'}" rel="noopener">${(it.title||'').toUpperCase()}</a>` +
                         (it.source ? ` <span class="source">(${it.source})</span>` : "") +
                         (it.ts ? `<span class="ts">${fmtTs(it.ts)}</span>` : "") +
                         (isNew ? ` <span class="new-flag">NEW</span>` : "");
          ul.appendChild(li);
        });
        container.appendChild(ul);
        container.appendChild(document.createElement("hr")); // thin divider
      });
    });
</script>
</body>
</html>
